packages:
  - packages/*
  - apps/*
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - framer-motion@13.5.0
  - globals@17.13.0
  - motion-dom@13.5.0
  - motion-utils@13.5.0
  - motion@13.5.0
  - turbo@2.11.6
  - vite@8.3.2

allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  # Postinstall only fetches a fallback binary; the prebuilt optional dependency is used.
  unrs-resolver: false
